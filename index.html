<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE ONE PRO LEAGUE - FIX DATA MODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Outfit:wght@700;900&display=swap');

        :root {
            --neon-red: #ff003c;
            --neon-glow: rgba(255, 0, 60, 0.5);
            --dark-bg: #050505;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--dark-bg); 
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .heading-font { font-family: 'Outfit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .score-box {
            background: #000; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-weight: 900; font-size: 15px;
            border: 1px solid #222;
        }

        .score-win { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); box-shadow: 0 0 10px rgba(34, 197, 94, 0.1); }
        .score-loss { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }
        .score-draw { color: #eab308; border-color: rgba(234, 179, 8, 0.4); }

        .nav-btn.active { background: var(--neon-red); box-shadow: 0 4px 15px var(--neon-glow); }
        
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-online { background: #22c55e; color: #000; }
        .status-offline { background: #ef4444; color: #fff; }

        .admin-score-input {
            width: 50px; height: 50px; background: #111; border: 1px solid #333;
            border-radius: 12px; text-align: center; font-weight: 900; color: #fff; font-size: 18px;
        }
        .admin-score-input:focus { border-color: var(--neon-red); outline: none; }

        .group-header {
            background: linear-gradient(90deg, rgba(255,0,60,0.1) 0%, transparent 100%);
            border-left: 3px solid var(--neon-red);
        }
    </style>
</head>
<body class="no-scrollbar pb-24">

<div id="loading-screen" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center">
    <div class="w-12 h-12 border-4 border-zinc-800 border-t-red-600 rounded-full animate-spin mb-4"></div>
    <p class="text-[10px] font-black tracking-widest text-zinc-500 uppercase">Synchronizing Live Data</p>
</div>

<!-- Admin Login Modal -->
<div id="admin-modal" class="fixed inset-0 z-[60] bg-black/95 flex items-center justify-center p-6 hidden">
    <div class="w-full max-w-xs space-y-6 text-center">
        <h2 class="heading-font text-xl uppercase italic">Admin <span class="text-red-600">Access</span></h2>
        <input type="password" id="adminPass" class="w-full bg-zinc-900 border border-white/10 rounded-2xl p-4 text-center tracking-[1em] outline-none focus:border-red-600" placeholder="••••">
        <button onclick="handleLogin()" class="w-full bg-red-600 p-4 rounded-2xl font-black uppercase text-xs">Login</button>
        <button onclick="toggleModal('admin-modal', false)" class="text-zinc-600 text-[10px] font-bold uppercase">Cancel</button>
    </div>
</div>

<header class="sticky top-0 z-40 bg-black/80 backdrop-blur-lg border-b border-white/5 px-6 py-5">
    <div class="flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-trophy text-white text-lg"></i>
            </div>
            <div>
                <h1 class="heading-font text-lg leading-none italic">THE ONE <span class="text-red-600">PRO</span></h1>
                <div id="sync-status" class="status-pill status-offline mt-1 w-fit">Disconnected</div>
            </div>
        </div>
        <div class="flex bg-zinc-900 p-1 rounded-xl">
            <button onclick="switchTab('user-view')" id="nav-user" class="nav-btn active px-5 py-2.5 rounded-lg text-[10px] font-black uppercase">PUBLIC</button>
            <button onclick="checkAdminAuth()" id="nav-admin" class="nav-btn px-5 py-2.5 rounded-lg text-[10px] font-black uppercase text-zinc-500">ADMIN</button>
        </div>
    </div>
</header>

<main class="p-5 max-w-2xl mx-auto">
    <!-- User View Section -->
    <section id="user-view" class="tab-content active">
        <div class="flex space-x-2 overflow-x-auto no-scrollbar mb-8">
            <button onclick="setRound(1)" id="round-1" class="flex-1 min-w-[100px] py-4 rounded-xl text-[10px] font-black border border-white/5 uppercase transition-all">Round 1</button>
            <button onclick="setRound(2)" id="round-2" class="flex-1 min-w-[100px] py-4 rounded-xl text-[10px] font-black border border-white/5 uppercase transition-all">Round 2</button>
            <button onclick="setRound(3)" id="round-3" class="flex-1 min-w-[100px] py-4 rounded-xl text-[10px] font-black border border-white/5 uppercase transition-all">Round 3</button>
        </div>

        <div class="space-y-12">
            <div>
                <h2 class="text-[11px] font-black uppercase tracking-[0.2em] text-zinc-600 mb-4 px-2 italic">Match Fixtures</h2>
                <div id="fixture-container" class="space-y-4"></div>
            </div>

            <div>
                <h2 class="text-[11px] font-black uppercase tracking-[0.2em] text-zinc-600 mb-4 px-2 italic">League Standings</h2>
                <div id="standings-container" class="space-y-8"></div>
            </div>
        </div>
    </section>

    <!-- Admin Panel Section -->
    <section id="admin-panel" class="tab-content space-y-8">
        <div class="glass-panel rounded-[2rem] p-8 text-center border-red-600/20">
            <h3 class="text-xs font-black uppercase text-red-600 mb-2 tracking-widest italic">Live Result Manager</h3>
            <p class="text-[10px] text-zinc-500 uppercase">Season 2 Score Control</p>
        </div>
        
        <div class="flex space-x-2 mb-4">
            <button onclick="setRound(1)" id="admin-rd-1" class="flex-1 py-3 rounded-xl text-[10px] font-black border border-white/5 uppercase transition-all">R1</button>
            <button onclick="setRound(2)" id="admin-rd-2" class="flex-1 py-3 rounded-xl text-[10px] font-black border border-white/5 uppercase transition-all">R2</button>
            <button onclick="setRound(3)" id="admin-rd-3" class="flex-1 py-3 rounded-xl text-[10px] font-black border border-white/5 uppercase transition-all">R3</button>
        </div>

        <div id="admin-matches" class="space-y-4"></div>
    </section>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDjKfiJjJOXU5N18d9afXapEr1FKcAcC4Y",
        authDomain: "theoneproleague-1e9db.firebaseapp.com",
        projectId: "theoneproleague-1e9db",
        storageBucket: "theoneproleague-1e9db.firebasestorage.app",
        messagingSenderId: "134837094397",
        appId: "1:134837094397:web:13dd1939b96f5b32487b94",
        measurementId: "G-KJ9FR70GXG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const SCORES_DOC = doc(db, "leagueData", "scores_v2");

    // Updated Player List (48 Players) with specific name changes
    const PLAYER_NAMES = [
        "Mg Zwe", "Thue Won Phyoe", "▄︻デK̷a̷v̷i̷n̷══━一", "Pyae Sone Hein", "York loa Cc", "Zee", "Dean", "Sexin Khant Kyaw",
        "Rice Chat", "Mine", "Myo Htet Aung", "Thein Htike", "Min Khant", "Kyaw Gyi", "Extra", "Van cro",
        "JP", "Aung Hein Oo", "BAD BOY", "Ranger", "J Ngar", "Vinn", "Wann", "M",
        "Zwe", "Ko Jake", "ဖိုးချမ်း", "Shar Htet Aung", "Nyan Lin Aung", "PSTW", "Arr Bhar", "H",
        "Ya Tha Nyo", "ŸÏ Wäï", "ZAW Phyo Thu", "San Tun Aung", "Yin Maung", "Mg PK", "Zayar Hein", "THAWN PI",
        "Aung Thiha", "Myan Khun", "Hein lay", "PSTW2", "Z3NN", "ッ 光明", "Octopus", "MinKhantKoKo"
    ];

    const G_NAMES = "ABCDEFGHIJKL".split("");
    let state = { teams: [], matches: [], scores: {}, activeRound: 1, isAdmin: false };

    function initLeague() {
        // Group players: 4 players per group
        state.teams = PLAYER_NAMES.map((name, i) => ({
            id: i + 1,
            name: name,
            group: G_NAMES[Math.floor(i / 4)],
            p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0
        }));

        state.matches = [];
        let mid = 1;
        G_NAMES.forEach(g => {
            const gt = state.teams.filter(t => t.group === g);
            // Fix Pairing Logic for 3 Rounds
            const pairings = [
                { h: 0, a: 1, r: 1 }, { h: 2, a: 3, r: 1 },
                { h: 0, a: 2, r: 2 }, { h: 1, a: 3, r: 2 },
                { h: 0, a: 3, r: 3 }, { h: 1, a: 2, r: 3 }
            ];
            pairings.forEach(p => {
                state.matches.push({
                    id: mid++,
                    group: g,
                    round: p.r,
                    home: gt[p.h].id,
                    away: gt[p.a].id
                });
            });
        });
    }

    onAuthStateChanged(auth, user => {
        if (user) {
            onSnapshot(SCORES_DOC, snap => {
                state.scores = snap.exists() ? snap.data() : {};
                updateStatus(true);
                recalculate();
                document.getElementById('loading-screen').style.display = 'none';
            }, err => {
                console.error("Permission Denied:", err);
                updateStatus(false, "Rules Locked");
            });
        } else {
            signInAnonymously(auth);
        }
    });

    function updateStatus(online, msg) {
        const el = document.getElementById('sync-status');
        el.innerText = online ? "Sync Active" : (msg || "Offline");
        el.className = `status-pill ${online ? 'status-online' : 'status-offline'}`;
    }

    function recalculate() {
        state.teams.forEach(t => { t.p = t.w = t.d = t.l = t.gf = t.ga = t.gd = t.pts = 0; });
        state.matches.forEach(m => {
            const res = state.scores[m.id];
            if (res && res.hS !== null && res.aS !== null) {
                const h = state.teams.find(t => t.id === m.home);
                const a = state.teams.find(t => t.id === m.away);
                const hs = parseInt(res.hS), as = parseInt(res.aS);
                h.p++; a.p++; h.gf += hs; h.ga += as; a.gf += as; a.ga += hs;
                if (hs > as) { h.w++; h.pts += 3; a.l++; }
                else if (as > hs) { a.w++; a.pts += 3; h.l++; }
                else { h.d++; a.d++; h.pts += 1; a.pts += 1; }
                h.gd = h.gf - h.ga; a.gd = a.gf - a.ga;
            }
        });
        render();
    }

    function render() {
        const getCls = (s1, s2) => (s1 === null || s2 === null) ? 'text-zinc-600' : (s1 > s2 ? 'score-win' : (s1 < s2 ? 'score-loss' : 'score-draw'));

        [1, 2, 3].forEach(i => {
            const btn = document.getElementById(`round-${i}`);
            btn.className = `flex-1 py-4 rounded-xl text-[10px] font-black border border-white/5 uppercase transition-all ${state.activeRound === i ? 'bg-red-600 text-white' : 'bg-zinc-900 text-zinc-500'}`;
            const admBtn = document.getElementById(`admin-rd-${i}`);
            if(admBtn) admBtn.className = `flex-1 py-3 rounded-xl text-[10px] font-black border border-white/5 uppercase transition-all ${state.activeRound === i ? 'bg-red-600 text-white' : 'bg-zinc-900 text-zinc-500'}`;
        });

        const rdMatches = state.matches.filter(m => m.round === state.activeRound);
        let lastG = "";
        
        // Render Fixtures
        document.getElementById('fixture-container').innerHTML = rdMatches.map(m => {
            let header = "";
            if (m.group !== lastG) {
                lastG = m.group;
                header = `<div class="group-header py-2 px-4 mb-3 text-[10px] font-black text-red-600 uppercase italic tracking-widest">Group ${m.group}</div>`;
            }
            const h = state.teams.find(t => t.id === m.home);
            const a = state.teams.find(t => t.id === m.away);
            const res = state.scores[m.id] || { hS: null, aS: null };
            return header + `
                <div class="glass-panel p-4 rounded-2xl flex items-center justify-between mb-2">
                    <div class="flex-1 text-right pr-4 text-[11px] font-bold truncate">${h.name}</div>
                    <div class="flex items-center space-x-2">
                        <div class="score-box ${getCls(res.hS, res.aS)}">${res.hS ?? '-'}</div>
                        <div class="score-box ${getCls(res.aS, res.hS)}">${res.aS ?? '-'}</div>
                    </div>
                    <div class="flex-1 text-left pl-4 text-[11px] font-bold truncate">${a.name}</div>
                </div>`;
        }).join('');

        // Render Standings
        document.getElementById('standings-container').innerHTML = G_NAMES.map(g => {
            const gt = state.teams.filter(t => t.group === g).sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.ga);
            return `
                <div class="bg-zinc-900/30 rounded-3xl p-5 border border-white/5">
                    <div class="flex items-center space-x-2 mb-4">
                        <span class="w-1.5 h-1.5 bg-red-600 rounded-full"></span>
                        <span class="text-[10px] font-black text-white uppercase italic tracking-widest">Group ${g} Standings</span>
                    </div>
                    <table class="w-full text-[10px]">
                        <thead><tr class="text-zinc-500 font-black border-b border-white/5">
                            <th class="text-left py-3 px-1">PLAYER</th><th>P</th><th>GD</th><th class="text-red-600">PTS</th>
                        </tr></thead>
                        <tbody>${gt.map((t, i) => `
                            <tr class="${i < 2 ? 'text-white' : 'text-zinc-500'} border-b border-white/5 last:border-0">
                                <td class="py-4 px-1 font-bold flex items-center">
                                    <span class="text-[8px] opacity-30 mr-2">0${i+1}</span>
                                    ${t.name}
                                </td>
                                <td class="text-center">${t.p}</td>
                                <td class="text-center font-mono">${t.gd > 0 ? '+' + t.gd : t.gd}</td>
                                <td class="text-center font-black text-xs ${i < 2 ? 'text-red-600' : ''}">${t.pts}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
        }).join('');

        // Render Admin Inputs
        if (state.isAdmin) {
            document.getElementById('admin-matches').innerHTML = rdMatches.map(m => {
                const h = state.teams.find(t => t.id === m.home);
                const a = state.teams.find(t => t.id === m.away);
                const res = state.scores[m.id] || { hS: '', aS: '' };
                return `
                    <div class="bg-zinc-950 p-5 rounded-2xl border border-white/5 flex flex-col space-y-4">
                        <div class="flex justify-between items-center px-1">
                            <span class="text-[9px] font-black text-zinc-600 uppercase">Group ${m.group} • Match ${m.id}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <div class="flex-1 text-right font-black text-xs truncate mr-4">${h.name}</div>
                            <div class="flex items-center space-x-3">
                                <input type="number" value="${res.hS ?? ''}" oninput="updateScore(${m.id}, this.value, 'home')" class="admin-score-input">
                                <span class="text-zinc-700 font-black text-xs italic">VS</span>
                                <input type="number" value="${res.aS ?? ''}" oninput="updateScore(${m.id}, this.value, 'away')" class="admin-score-input">
                            </div>
                            <div class="flex-1 text-left font-black text-xs truncate ml-4">${a.name}</div>
                        </div>
                    </div>`;
            }).join('');
        }
    }

    window.updateScore = async (id, val, side) => {
        if (!state.scores[id]) state.scores[id] = { hS: null, aS: null };
        const numVal = val === "" ? null : parseInt(val);
        if (side === 'home') state.scores[id].hS = numVal;
        else state.scores[id].aS = numVal;
        
        try {
            await setDoc(SCORES_DOC, state.scores, { merge: true });
        } catch (e) {
            console.error("Write Error:", e);
        }
    };

    window.switchTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        state.isAdmin = id === 'admin-panel';
        document.getElementById('nav-admin').className = `nav-btn px-5 py-2.5 rounded-lg text-[10px] font-black uppercase ${state.isAdmin ? 'active' : 'text-zinc-500'}`;
        document.getElementById('nav-user').className = `nav-btn px-5 py-2.5 rounded-lg text-[10px] font-black uppercase ${!state.isAdmin ? 'active' : 'text-zinc-500'}`;
        render();
    };

    window.toggleModal = (id, show) => document.getElementById(id).classList.toggle('hidden', !show);
    window.checkAdminAuth = () => state.isAdmin ? switchTab('admin-panel') : toggleModal('admin-modal', true);
    window.handleLogin = () => {
        if (document.getElementById('adminPass').value === "1234") {
            toggleModal('admin-modal', false);
            switchTab('admin-panel');
        } else {
            alert("Incorrect Passcode");
        }
    };
    window.setRound = (r) => { state.activeRound = r; render(); };

    window.onload = initLeague;
</script>
</body>
</html>
