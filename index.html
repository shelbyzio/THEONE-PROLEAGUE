<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ONE PRO LEAGUE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root {
            --primary-red: #ef4444;
            --primary-green: #22c55e;
            --primary-yellow: #eab308;
            --dark-bg: #0a0a0a;
            --card-bg: #111111;
            --border-color: #262626;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(239, 68, 68, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(239, 68, 68, 0.08) 0%, transparent 40%);
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        .round-container {
            display: none; 
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .round-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .round-title {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--primary-red);
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            padding: 1rem 0;
            border-bottom: 2px solid var(--primary-red);
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        .matchup {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 1.5rem;
            margin: 1.25rem 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .matchup:hover {
            border-color: rgba(239, 68, 68, 0.3);
            box-shadow: 0 10px 30px -10px rgba(239, 68, 68, 0.15);
        }

        .match-badge {
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--primary-red);
            color: white;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
        }

        .score-box {
            min-width: 34px;
            height: 34px;
            background: #161616;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.95rem;
            color: #888;
            transition: all 0.2s;
        }

        .aggregate-badge {
            font-size: 0.7rem;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-win { color: var(--primary-green) !important; border-color: rgba(34, 197, 94, 0.4) !important; background: rgba(34, 197, 94, 0.05); }
        .score-lose { color: var(--primary-red) !important; border-color: rgba(239, 68, 68, 0.4) !important; background: rgba(239, 68, 68, 0.05); }
        .score-draw { color: var(--primary-yellow) !important; border-color: rgba(234, 179, 8, 0.4) !important; background: rgba(234, 179, 8, 0.05); }

        .nav-btn {
            padding: 0.75rem 2rem;
            border-radius: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .hidden-view { display: none !important; }
        
        .admin-score-input {
            width: 55px;
            height: 40px;
            background: #000;
            border: 1px solid #444;
            color: white;
            text-align: center;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
        }
        .admin-score-input:focus {
            border-color: var(--primary-red);
            outline: none;
        }

        #auth-modal {
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(12px);
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--dark-bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay">
    <div class="w-12 h-12 border-4 border-red-600 border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="text-[10px] font-bold text-neutral-400 uppercase tracking-widest px-4 text-center">ပွဲစဉ်ဇယားများကို ပြင်ဆင်နေပါသည်...</div>
</div>

<header class="pt-8 pb-4 text-center px-4">
    <div class="flex justify-center mb-3">
        <span id="db-status-badge" class="px-3 py-1 rounded-full text-[9px] font-bold tracking-wider uppercase border bg-red-950/40 text-red-400 border-red-800/40">
            🔴 Code-Defined Fixtures Mode
        </span>
    </div>
    <h1 class="text-4xl font-extrabold mb-2 tracking-tighter text-white uppercase italic">PRO LEAGUE</h1>
    <div class="flex justify-center gap-3 mt-6">
        <button onclick="toggleMainView('bracket')" id="bracket-btn" class="px-6 py-2 rounded-lg bg-red-600 text-white font-bold text-[10px] uppercase tracking-widest transition-all">Bracket View</button>
        <button onclick="checkAdminAuth()" id="admin-btn" class="px-6 py-2 rounded-lg bg-neutral-900 text-neutral-500 font-bold text-[10px] uppercase tracking-widest transition-all">Admin Panel</button>
    </div>
</header>

<!-- Toast notification box -->
<div id="custom-toast" class="fixed bottom-5 right-5 z-50 bg-neutral-900 border border-neutral-800 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
    <div id="toast-indicator" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
    <div id="toast-msg" class="text-xs font-bold text-white">အောင်မြင်ပါသည်။</div>
</div>

<main id="bracket-view" class="max-w-xl mx-auto px-4 pb-24">
    <div id="rounds-wrapper"></div>
    
    <div class="flex justify-between items-center mt-8 pt-6 border-t border-neutral-800">
        <button id="prev-round" onclick="changeRound(-1)" class="nav-btn bg-neutral-800 text-neutral-400">ရှေ့သို့</button>
        <div id="round-indicator" class="text-[10px] font-black text-neutral-500 uppercase tracking-[0.3em]">အဆင့် ၁ / ၅</div>
        <button id="next-round" onclick="changeRound(1)" class="nav-btn bg-red-600 text-white shadow-lg shadow-red-900/20">နောက်တစ်ဆင့်</button>
    </div>
</main>

<div id="admin-view" class="hidden-view px-4 pb-24 max-w-2xl mx-auto">
    <div class="bg-[#111] border border-neutral-800 rounded-3xl p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-white uppercase italic">ရမှတ်များ စမ်းသပ်ရန်</h2>
            <button onclick="logoutAdmin()" class="text-[9px] font-bold text-neutral-600 hover:text-red-500 uppercase tracking-widest">Logout</button>
        </div>
        <div class="mb-6">
            <button id="reset-btn" onclick="resetTournament()" class="w-full py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-black text-xs uppercase tracking-wider transition-all shadow-lg shadow-red-900/20">
                မူလကုဒ်ပါ Fixtures အတိုင်း ပြန်လည်သတ်မှတ်မည် (Reset Bracket)
            </button>
        </div>
        <div id="admin-match-list" class="space-y-4"></div>
    </div>
</div>

<!-- Password Access Modal -->
<div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-neutral-900 border border-neutral-800 p-8 rounded-3xl w-full max-w-sm shadow-2xl">
        <div class="text-center mb-6">
            <div class="inline-block p-3 rounded-full bg-red-600/10 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-600"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h3 class="text-lg font-bold text-white">Admin Access</h3>
            <p class="text-neutral-500 text-xs mt-1">ရှေ့ဆက်ရန် Password ရိုက်ထည့်ပါ</p>
        </div>
        <input type="password" id="admin-pw" placeholder="••••" class="w-full bg-black border border-neutral-800 rounded-xl p-4 text-center text-2xl font-bold text-red-500 tracking-[0.5em] focus:border-red-600 focus:outline-none mb-4">
        <div class="flex gap-2">
            <button onclick="closeAuthModal()" class="flex-1 py-3 rounded-xl bg-neutral-800 text-neutral-400 font-bold text-xs uppercase">Cancel</button>
            <button onclick="verifyPassword()" class="flex-1 py-3 rounded-xl bg-red-600 text-white font-bold text-xs uppercase shadow-lg shadow-red-900/20">Login</button>
        </div>
        <p id="auth-error" class="text-red-500 text-[10px] font-bold text-center mt-4 hidden">Password မှားယွင်းနေပါသည်။ ပြန်ကြိုးစားပါ။</p>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "1234";
    let isAdminAuthenticated = false;
    let currentActiveRound = 0;
    let tournamentData = {};

    const initialPlayers = [
        "▄︻デK̷a̷v̷i̷n̷══━一", "York Loa Cc",
        "Thue Won Phyoe", "Myan Khun",
        "Sexin Khant Kyaw", "Pyae Sone Hein",
        "Dean", "Ya Tha Nyo",
        "Thein Htike", "Vinn",
        "Rice Chat", "P,S,T,W",
        "Kyaw Gyi", "Zwe",
        "Min Khant", "PSTW 2",
        "JP", "Yi Wai",
        "Aung Hein Oo", "Ko Jake",
        "M", "Aung Thiha",
        "J Ngar", "Octopus",
        "ဖိုးချမ်း", "Zayar Hein",
        "H", "THAWN PI",
        "Nyan Lin Aung", "ッ 光明",
        "Zaw Phyo Thu", "Van Cro"
    ];

    const roundsData = [
        { name: "Round of 32", matches: 16, type: "home-away" },
        { name: "Round of 16", matches: 8, type: "home-away" },
        { name: "Quarter Final", matches: 4, type: "home-away" },
        { name: "Semi Final", matches: 2, type: "home-away" },
        { name: "Grand Final", matches: 1, type: "single" }
    ];

    function initApp() {
        createBracketUI();
        setupStaticTournamentData();
        hideLoadingScreen();
    }

    function hideLoadingScreen() {
        const loading = document.getElementById('loading');
        loading.style.opacity = '0';
        setTimeout(() => loading.style.display = 'none', 500);
    }

    function setupStaticTournamentData() {
        tournamentData = generateCleanInitialData();
        syncDataToUI();
    }

    // Populate the latest matches scores as requested
    function generateCleanInitialData() {
        const data = { rounds: [] };
        
        // Round of 32 Results (Home and Away legs)
        const round32Scores = [
            { t1s1: 4, t1s2: 6, t2s1: 1, t2s2: 2 },   // Match 1: Kavin vs York Loa Cc
            { t1s1: 5, t1s2: 2, t2s1: 5, t2s2: 5 },   // Match 2: Thue Won Phyoe vs Myan Khun
            { t1s1: 2, t1s2: 4, t2s1: 1, t2s2: 1 },   // Match 3: Sexin Khant Kyaw vs Pyae Sone Hein
            { t1s1: 3, t1s2: 3, t2s1: 0, t2s2: 0 },   // Match 4: Dean vs Ya Tha Nyo
            { t1s1: 10, t1s2: 1, t2s1: 3, t2s2: 1 },  // Match 5: Thein Htike vs Vinn
            { t1s1: 0, t1s2: 0, t2s1: 4, t2s2: 2 },   // Match 6: Rice Chat vs P,S,T,W
            { t1s1: 2, t1s2: 1, t2s1: 4, t2s2: 5 },   // Match 7: Kyaw Gyi vs Zwe
            { t1s1: 4, t1s2: 5, t2s1: 2, t2s2: 3 },   // Match 8: Min Khant vs PSTW 2
            { t1s1: 3, t1s2: 5, t2s1: 3, t2s2: 4 },   // Match 9: JP vs Yi Wai
            { t1s1: 6, t1s2: 3, t2s1: 5, t2s2: 8 },   // Match 10: Aung Hein Oo vs Ko Jake
            { t1s1: 0, t1s2: 2, t2s1: 3, t2s2: 2 },   // Match 11: M vs Aung Thiha
            { t1s1: 3, t1s2: 3, t2s1: 1, t2s2: 0 },   // Match 12: J Ngar vs Octopus
            { t1s1: 3, t1s2: 5, t2s1: 4, t2s2: 5 },   // Match 13: ဖိုးချမ်း vs Zayar Hein
            { t1s1: 6, t1s2: 2, t2s1: 1, t2s2: 0 },   // Match 14: H vs THAWN PI
            { t1s1: 1, t1s2: 6, t2s1: 5, t2s2: 3 },   // Match 15: Nyan Lin Aung vs ッ 光明
            { t1s1: 0, t1s2: 0, t2s1: 3, t2s2: 3 }    // Match 16: Zaw Phyo Thu vs Van Cro
        ];

        // NEW: Round of 16 Results (Incorporating user request data)
        const round16Scores = {
            0: { t1s1: 6, t1s2: 3, t2s1: 6, t2s2: 1 }, // Kavin vs Myan Khun
            1: { t1s1: 0, t1s2: 1, t2s1: 4, t2s2: 6 }, // Sxine Khant Kyaw vs Dean
            2: { t1s1: 3, t1s2: 1, t2s1: 3, t2s2: 2 }, // Thein Htike vs P,S,T,W
            3: { t1s1: 2, t1s2: 6, t2s1: 5, t2s2: 2 }, // Zwe vs Min Khant
            4: { t1s1: 1, t1s2: 6, t2s1: 1, t2s2: 5 }, // JP vs Ko Jake
            5: { t1s1: 5, t1s2: 0, t2s1: 5, t2s2: 3 }, // Aung Thiha vs J Ngar
            6: { t1s1: 0, t1s2: 1, t2s1: 5, t2s2: 4 },  // Zayar Hein vs H
            7: { t1s1: 2, t1s2: 1, t2s1: 2, t2s2: 2 }, // Van Cro vs ッ 光明
        };

        

        roundsData.forEach((round, rIdx) => {
            const matches = [];
            for (let i = 0; i < round.matches; i++) {
                let matchObj = {
                    t1name: "",
                    t2name: "",
                    t1s1: 0, t1s2: 0, t2s1: 0, t2s2: 0
                };
                
                if (rIdx === 0) {
                    matchObj.t1name = initialPlayers[i * 2] || "";
                    matchObj.t2name = initialPlayers[i * 2 + 1] || "";
                    const scores = round32Scores[i];
                    if (scores) {
                        matchObj.t1s1 = scores.t1s1;
                        matchObj.t1s2 = scores.t1s2;
                        matchObj.t2s1 = scores.t2s1;
                        matchObj.t2s2 = scores.t2s2;
                    }
                }
                matches.push(matchObj);
            }
            data.rounds.push({ matches });
        });

        // Run dynamic propagation
        recalculateProgression(data);

        // Populate Round of 16 preset scores
        Object.keys(round16Scores).forEach(mIdx => {
            if (data.rounds[1] && data.rounds[1].matches[mIdx]) {
                const match = data.rounds[1].matches[mIdx];
                match.t1s1 = round16Scores[mIdx].t1s1;
                match.t1s2 = round16Scores[mIdx].t1s2;
                match.t2s1 = round16Scores[mIdx].t2s1;
                match.t2s2 = round16Scores[mIdx].t2s2;
            }
        });

        // Run dynamic propagation again to propagate Round of 16 winners to Quarter Finals
        recalculateProgression(data);

        return data;
    }

    function recalculateProgression(data) {
        // Clear subsequent team slots to avoid duplicate/dead names
        for (let r = 1; r < data.rounds.length; r++) {
            data.rounds[r].matches.forEach(match => {
                match.t1name = "";
                match.t2name = "";
            });
        }

        // Auto progression logic
        for (let r = 0; r < data.rounds.length - 1; r++) {
            const roundMatches = data.rounds[r].matches;
            roundMatches.forEach((match, m) => {
                const t1total = match.t1s1 + (match.t1s2 || 0);
                const t2total = match.t2s1 + (match.t2s2 || 0);
                
                // Only evaluate progression if at least one side has score points or won
                const hasScore = (match.t1s1 > 0 || match.t1s2 > 0 || match.t2s1 > 0 || match.t2s2 > 0);
                const winner = (t1total > t2total) ? match.t1name : ((t2total > t1total) ? match.t2name : "");
                
                if (winner && hasScore) {
                    const nextRound = r + 1;
                    const nextMatch = Math.floor(m / 2);
                    const teamSlot = (m % 2 === 0) ? 't1name' : 't2name';
                    if (data.rounds[nextRound] && data.rounds[nextRound].matches[nextMatch]) {
                        data.rounds[nextRound].matches[nextMatch][teamSlot] = winner;
                    }
                }
            });
        }
    }

    function syncDataToUI() {
        if (!tournamentData || !tournamentData.rounds) return;
        
        tournamentData.rounds.forEach((round, rIdx) => {
            round.matches.forEach((match, mIdx) => {
                const isFinal = roundsData[rIdx].type === "single";
                
                // Update text values
                updateElement(`r${rIdx}m${mIdx}t1name`, match.t1name || "TBD", 'val');
                updateElement(`r${rIdx}m${mIdx}t2name`, match.t2name || "TBD", 'val');
                updateElement(`r${rIdx}m${mIdx}t1s1-disp`, match.t1s1);
                updateElement(`r${rIdx}m${mIdx}t2s1-disp`, match.t2s1);
                
                if (!isFinal) {
                    updateElement(`r${rIdx}m${mIdx}t1s2-disp`, match.t1s2);
                    updateElement(`r${rIdx}m${mIdx}t2s2-disp`, match.t2s2);
                    
                    // Show Aggregate
                    const agg1 = match.t1s1 + match.t1s2;
                    const agg2 = match.t2s1 + match.t2s2;
                    updateElement(`r${rIdx}m${mIdx}agg-disp`, `AGG: ${agg1} - ${agg2}`);
                }

                // Apply victory coloring
                applyColoring(rIdx, mIdx);
            });
        });
        
        // Refresh admin layout
        if (!document.getElementById('admin-view').classList.contains('hidden-view')) {
            generateAdminList();
        }
    }

    function updateElement(id, val, type = 'text') {
        const el = document.getElementById(id);
        if (!el) return;
        if (type === 'val') {
            el.value = val;
            // Style TBD fields visually
            if (val === "TBD" || val === "") {
                el.classList.add('text-neutral-600', 'italic');
            } else {
                el.classList.remove('text-neutral-600', 'italic');
            }
        } else {
            el.innerText = val;
        }
    }

    function showCustomToast(msg, type = "success") {
        const toast = document.getElementById('custom-toast');
        const indicator = document.getElementById('toast-indicator');
        const text = document.getElementById('toast-msg');
        
        if (type === "success") {
            indicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
        } else {
            indicator.className = "w-2.5 h-2.5 rounded-full bg-red-500";
        }
        
        text.innerText = msg;
        toast.className = "fixed bottom-5 right-5 z-50 bg-neutral-900 border border-neutral-800 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-0 opacity-100";
        
        setTimeout(() => {
            toast.className = "fixed bottom-5 right-5 z-50 bg-neutral-900 border border-neutral-800 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none";
        }, 3000);
    }

    window.toggleMainView = (view) => {
        const bracketBtn = document.getElementById('bracket-btn');
        const adminBtn = document.getElementById('admin-btn');
        
        if(view === 'bracket') {
            document.getElementById('bracket-view').classList.remove('hidden-view');
            document.getElementById('admin-view').classList.add('hidden-view');
            bracketBtn.className = "px-6 py-2 rounded-lg bg-red-600 text-white font-bold text-[10px] uppercase tracking-widest transition-all";
            adminBtn.className = "px-6 py-2 rounded-lg bg-neutral-900 text-neutral-500 font-bold text-[10px] uppercase tracking-widest transition-all";
        } else {
            document.getElementById('bracket-view').classList.add('hidden-view');
            document.getElementById('admin-view').classList.remove('hidden-view');
            adminBtn.className = "px-6 py-2 rounded-lg bg-red-600 text-white font-bold text-[10px] uppercase tracking-widest transition-all";
            bracketBtn.className = "px-6 py-2 rounded-lg bg-neutral-900 text-neutral-500 font-bold text-[10px] uppercase tracking-widest transition-all";
            generateAdminList();
        }
    };

    window.checkAdminAuth = () => {
        if (isAdminAuthenticated) toggleMainView('admin');
        else {
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('admin-pw').focus();
        }
    };

    window.closeAuthModal = () => {
        document.getElementById('auth-modal').classList.add('hidden');
        document.getElementById('admin-pw').value = '';
        document.getElementById('auth-error').classList.add('hidden');
    };

    window.verifyPassword = () => {
        if (document.getElementById('admin-pw').value === ADMIN_PASSWORD) {
            isAdminAuthenticated = true;
            closeAuthModal();
            toggleMainView('admin');
        } else {
            document.getElementById('auth-error').classList.remove('hidden');
        }
    };

    window.logoutAdmin = () => {
        isAdminAuthenticated = false;
        toggleMainView('bracket');
    };

    let confirmReset = false;
    window.resetTournament = () => {
        const btn = document.getElementById('reset-btn');
        if (!confirmReset) {
            confirmReset = true;
            btn.innerText = "တကယ်ပဲ Reset လုပ်မှာ သေချာပါသလား? (အတည်ပြုရန် ထပ်နှိပ်ပါ)";
            btn.className = "w-full py-3 rounded-xl bg-yellow-600 text-white font-black text-xs uppercase tracking-wider transition-all shadow-lg shadow-yellow-900/20";
            setTimeout(() => {
                confirmReset = false;
                btn.innerText = "မူလကုဒ်ပါ Fixtures အတိုင်း ပြန်လည်သတ်မှတ်မည် (Reset Bracket)";
                btn.className = "w-full py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-black text-xs uppercase tracking-wider transition-all shadow-lg shadow-red-900/20";
            }, 4000);
            return;
        }
        confirmReset = false;
        setupStaticTournamentData();
        showCustomToast("မူလရမှတ်များအတိုင်း အောင်မြင်စွာ ပြန်လည်သတ်မှတ်ပြီးပါပြီ။");
    };

    window.changeRound = (dir) => {
        const newRound = currentActiveRound + dir;
        if(newRound >= 0 && newRound < roundsData.length) {
            document.getElementById(`round-container-${currentActiveRound}`).classList.remove('active');
            currentActiveRound = newRound;
            document.getElementById(`round-container-${currentActiveRound}`).classList.add('active');
            updateNavButtons();
            window.scrollTo(0,0);
        }
    };

    function createBracketUI() {
        const wrapper = document.getElementById('rounds-wrapper');
        wrapper.innerHTML = '';
        roundsData.forEach((round, rIdx) => {
            const container = document.createElement('div');
            container.className = `round-container ${rIdx === 0 ? 'active' : ''}`;
            container.id = `round-container-${rIdx}`;
            let html = `<div class="round-title">${round.name}</div><div class="grid gap-4">`;
            for (let i = 0; i < round.matches; i++) {
                const isFinal = round.type === "single";
                html += `
                    <div class="matchup">
                        <div class="match-badge">Match ${i+1}</div>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <input type="text" readonly class="bg-transparent font-extrabold text-sm outline-none w-1/2 tracking-tight text-neutral-100" id="r${rIdx}m${i}t1name" value="TBD">
                                <div class="flex gap-1 items-center">
                                    <div class="score-box" id="r${rIdx}m${i}t1s1-disp">0</div>
                                    ${!isFinal ? `<div class="score-box" id="r${rIdx}m${i}t1s2-disp">0</div>` : ''}
                                </div>
                            </div>
                            <div class="flex justify-between items-center">
                                <input type="text" readonly class="bg-transparent font-extrabold text-sm outline-none w-1/2 tracking-tight text-neutral-100" id="r${rIdx}m${i}t2name" value="TBD">
                                <div class="flex gap-1 items-center">
                                    <div class="score-box" id="r${rIdx}m${i}t2s1-disp">0</div>
                                    ${!isFinal ? `<div class="score-box" id="r${rIdx}m${i}t2s2-disp">0</div>` : ''}
                                </div>
                            </div>
                            ${!isFinal ? `
                            <div class="flex justify-end pt-1">
                                <div class="aggregate-badge" id="r${rIdx}m${i}agg-disp">AGG: 0 - 0</div>
                            </div>` : ''}
                        </div>
                    </div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
            wrapper.appendChild(container);
        });
        updateNavButtons();
    }

    function generateAdminList() {
        const list = document.getElementById('admin-match-list');
        if (!tournamentData || !tournamentData.rounds) return;
        
        list.innerHTML = `<div class="text-red-500 font-bold text-[10px] mb-4 uppercase tracking-tighter">ပြင်ဆင်နေသည့်အဆင့်: ${roundsData[currentActiveRound].name}</div>`;
        const round = tournamentData.rounds[currentActiveRound];
        const rIdx = currentActiveRound;

        round.matches.forEach((match, mIdx) => {
            const isFinal = roundsData[rIdx].type === "single";
            const div = document.createElement('div');
            div.className = "p-4 bg-neutral-950/60 border border-neutral-900 rounded-xl flex items-center justify-between gap-4";
            
            const team1Display = match.t1name || 'T1 (TBD)';
            const team2Display = match.t2name || 'T2 (TBD)';
            
            div.innerHTML = `
                <div class="text-xs font-bold w-2/5 truncate">
                    <span class="text-red-400 font-black mr-1">#${mIdx+1}</span> 
                    <div class="text-white">${team1Display}</div>
                    <div class="text-neutral-500 text-[10px] my-0.5">VS</div>
                    <div class="text-white">${team2Display}</div>
                </div>
                <div class="flex gap-4 items-center">
                    <div class="flex flex-col gap-1 items-center">
                        <div class="text-[9px] uppercase font-bold text-neutral-500">T1 Scores</div>
                        <div class="flex gap-1">
                            <input type="number" class="admin-score-input" value="${match.t1s1}" onchange="updateInMemoryScore(${rIdx}, ${mIdx}, 't1s1', this.value)">
                            ${!isFinal ? `<input type="number" class="admin-score-input" value="${match.t1s2}" onchange="updateInMemoryScore(${rIdx}, ${mIdx}, 't1s2', this.value)">` : ''}
                        </div>
                    </div>
                    <div class="flex flex-col gap-1 items-center">
                        <div class="text-[9px] uppercase font-bold text-neutral-500">T2 Scores</div>
                        <div class="flex gap-1">
                            <input type="number" class="admin-score-input" value="${match.t2s1}" onchange="updateInMemoryScore(${rIdx}, ${mIdx}, 't2s1', this.value)">
                            ${!isFinal ? `<input type="number" class="admin-score-input" value="${match.t2s2}" onchange="updateInMemoryScore(${rIdx}, ${mIdx}, 't2s2', this.value)">` : ''}
                        </div>
                    </div>
                </div>`;
            list.appendChild(div);
        });
    }

    window.updateInMemoryScore = (r, m, field, val) => {
        if (!tournamentData.rounds) return;
        
        // Save in memory
        tournamentData.rounds[r].matches[m][field] = parseInt(val) || 0;
        
        // Recalculate whole bracket progression
        recalculateProgression(tournamentData);

        // Force UI update
        syncDataToUI(); 
    };

    function applyColoring(r, m) {
        const isFinal = roundsData[r].type === "single";
        
        const t1s1El = document.getElementById(`r${r}m${m}t1s1-disp`);
        const t2s1El = document.getElementById(`r${r}m${m}t2s1-disp`);
        const t1s2El = document.getElementById(`r${r}m${m}t1s2-disp`);
        const t2s2El = document.getElementById(`r${r}m${m}t2s2-disp`);
        
        // Reset classes
        t1s1El?.classList.remove('score-win', 'score-lose', 'score-draw');
        t2s1El?.classList.remove('score-win', 'score-lose', 'score-draw');
        t1s2El?.classList.remove('score-win', 'score-lose', 'score-draw');
        t2s2El?.classList.remove('score-win', 'score-lose', 'score-draw');

        const t1s1 = parseInt(t1s1El?.innerText || 0);
        const t2s1 = parseInt(t2s1El?.innerText || 0);
        const t1s2 = isFinal ? 0 : parseInt(t1s2El?.innerText || 0);
        const t2s2 = isFinal ? 0 : parseInt(t2s2El?.innerText || 0);

        const t1Total = t1s1 + t1s2;
        const t2Total = t2s1 + t2s2;

        const hasActivity = (t1s1 > 0 || t2s1 > 0 || t1s2 > 0 || t2s2 > 0);

        if (hasActivity) {
            // Leg 1 Coloring
            if (t1s1 > t2s1) {
                t1s1El?.classList.add('score-win');
                t2s1El?.classList.add('score-lose');
            } else if (t2s1 > t1s1) {
                t2s1El?.classList.add('score-win');
                t1s1El?.classList.add('score-lose');
            } else {
                t1s1El?.classList.add('score-draw');
                t2s1El?.classList.add('score-draw');
            }

            // Leg 2 Coloring
            if (!isFinal) {
                if (t1s2 > t2s2) {
                    t1s2El?.classList.add('score-win');
                    t2s2El?.classList.add('score-lose');
                } else if (t2s2 > t1s2) {
                    t2s2El?.classList.add('score-win');
                    t1s2El?.classList.add('score-lose');
                } else {
                    t1s2El?.classList.add('score-draw');
                    t2s2El?.classList.add('score-draw');
                }
            }
        }
    }

    function updateNavButtons() {
        document.getElementById('prev-round').disabled = currentActiveRound === 0;
        document.getElementById('next-round').disabled = currentActiveRound === roundsData.length - 1;
        document.getElementById('round-indicator').innerText = `အဆင့် ${currentActiveRound + 1} / ${roundsData.length}`;
    }

    // Start App
    window.onload = function() {
        initApp();
    };
</script>
</body>
</html>
